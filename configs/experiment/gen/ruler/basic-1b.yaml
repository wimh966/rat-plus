# @package _global_
defaults:
  - /data: ruler/llama
  - /model/backbone: sequence
  - /model/backbone/layer@model.backbone.seq_cell: ratplus
  - /model/backbone/layer@model.backbone.hidden_cell: ffn
  - /model/head: lm
  - /model/embedding: lm
  - /model/embedding@model.embedding.pe: rope
  - /task: lm
  - /optim/lr_scheduler: cosine
  - /optim/optimizer: adamw
  - _self_

data:
  global_batch_size: 32
  seq_len: 4096
  batch_size: 1
  train:
    limit_tokens: -1
  val:
    limit_tokens: -1

optim:
  optimizer:
    lr: 1.0e-5
    weight_decay: 0.01
    betas: [0.9,0.95]
  lr_scheduler:
    warmup_iter: 0.05 # keep the same with the pre-training
    eta_min: 1.0e-6

wandb:
  job_type: ruler_gen

wandb_use: false

model:
  backbone:
    num_layers: 24
    d_model: 2048
    dropout: 0.0
    bias: false
    ln: rmsnorm
    init:
      _name_: fixed
      initializer_range: 0.02
    seq_cell:
      d_head: 128
      chunk_size: 1
      chunk_size1: 1
      prefix_size: 4
      local_size: 0
      apply_re: true
      mix_train: false
task:
  ignore_index: -100

trainer:
  global_batch_size: ${data.global_batch_size}
  gradient_clipping: 1.0
  max_epoch: 1
  load_checkpoint: false
  save_checkpoint: true
  log_interval: 50
  save_interval: 1.0
  eval_when_log: false
  dtype: bfloat16
  save_dir: ${base_dir}/exp/ckpt/${wandb.job_type}/dilation/d${model.backbone.seq_cell.chunk_size1}w${model.backbone.seq_cell.local_size}p${model.backbone.seq_cell.prefix_size}/
  pretrained_path: /home/xwei/fake_path/sequence_model/exp/ckpt/ruler_sft/niah_multikey_34096-lm-lmposrope10000-sequenced2048l24-ratplus16localprefixfgatesimplel1l${model.backbone.seq_cell.chunk_size1}p4w${model.backbone.seq_cell.local_size}reTruemixtrainFalseropepostogatefFalse-ffn-lm/1e-05_32_4/2247.pth